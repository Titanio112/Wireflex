name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wireflex.slnx

      - name: Build
        run: dotnet build Wireflex.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wireflex.slnx --configuration Release --no-build --verbosity normal
